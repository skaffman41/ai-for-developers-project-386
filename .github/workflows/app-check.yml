name: app-check

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current Release PR head SHA
        required: true
        type: string
      release_pr:
        description: Release PR number
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify the dispatched SHA
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EVENT_SHA: ${{ github.sha }}
        run: test "$EXPECTED_SHA" = "$EVENT_SHA"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: "2026.11.3"
          install_args: "--locked"

      - run: mise exec -- npm ci

      - run: mise run browser:install -- --with-deps

      - run: mise run check

      - name: Verify the Release PR is still current
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_PR: ${{ inputs.release_pr }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: Number(process.env.RELEASE_PR),
            });
            if (pr.state !== 'open' || pr.base.ref !== 'main' ||
                pr.head.ref !== 'release-please--branches--main' ||
                pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                pr.head.sha !== process.env.EXPECTED_SHA) {
              throw new Error('Release PR changed during app-check; check its current SHA again');
            }
            core.info(`app-check passed for Release PR #${pr.number} at ${pr.head.sha}`);

      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
