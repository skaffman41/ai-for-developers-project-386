min_version = "2026.11.3"

[tools]
node = "24.22.2"
hk = "2.11.1"
gh = "2.103.3"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]

[tasks."env:check"]
description = "Check the exact mise, Node and npm versions"
run = "node scripts/check-env.mjs"

[tasks.setup]
description = "Check versions, install locked npm dependencies and local Git hooks"
depends = ["env:check"]
run = ["npm ci", "mise run hooks:install"]

[tasks."hooks:install"]
description = "Install hk hooks for this clone through mise"
depends = ["env:check"]
run = "hk install --mise"

[tasks.dev]
description = "Run both applications; stop both on failure or Ctrl+C"
depends = ["dev:frontend", "dev:backend"]

[tasks."dev:frontend"]
depends = ["env:check"]
run = "npm run dev --workspace frontend --"

[tasks."dev:backend"]
depends = ["env:check"]
run = "npm run dev --workspace backend"

[tasks.build]
depends = ["env:check"]
run = "npm run build"

[tasks.typecheck]
depends = ["env:check"]
run = "npm run typecheck"

[tasks.lint]
description = "Check JavaScript and TypeScript; reject warnings"
depends = ["env:check"]
run = "npm run lint"

[tasks."format:check"]
description = "Check formatting without changing files"
depends = ["env:check"]
run = "npm run format:check"

[tasks.format]
description = "Format files except generated output, lockfiles and the Hexlet workflow"
depends = ["env:check"]
run = "npm run format"

[tasks.test]
description = "Build both applications and run the HTTP smoke once"
depends = ["build"]
run = "npm test"

[tasks."browser:install"]
description = "Install the pinned Playwright Chromium; pass --with-deps on Linux"
depends = ["env:check"]
run = "npm run browser:install --"

[tasks."test:browser"]
description = "Build and check the guest journey in Chromium against frontend preview"
depends = ["build"]
run = "npm run test:browser --"

[tasks.check]
description = "Check versions, lint, formatting, types, build, HTTP smoke, browser and hk config"
depends = ["env:check", "lint", "format:check", "typecheck", "test", "test:browser"]
run = "hk validate"

[tasks."start:backend"]
depends = ["env:check"]
run = "npm run start --workspace backend"

[tasks."preview:frontend"]
depends = ["env:check"]
run = "npm run preview --workspace frontend --"
