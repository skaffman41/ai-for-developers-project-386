min_version = "2026.11.3"

[tools]
node = "24.22.2"
hk = "2.11.1"
gh = "2.103.3"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]

[tasks."env:check"]
description = "Check the exact mise, Node and npm versions"
run = "node scripts/check-env.mjs"

[tasks.setup]
description = "Check versions, install locked npm dependencies and local Git hooks"
depends = ["env:check"]
run = ["npm ci", "mise run hooks:install"]

[tasks."hooks:install"]
description = "Install hk hooks for this clone through mise"
depends = ["env:check"]
run = "hk install --mise"

[tasks."api:generate"]
description = "Compile TypeSpec and regenerate OpenAPI, API models, schemas, SDK, server types, registry and documentation"
depends = ["env:check"]
run = "npm run api:generate"

[tasks."api:check"]
description = "Compile TypeSpec, validate OpenAPI and compare all generated API artifacts"
depends = ["env:check"]
run = "npm run api:check"

[tasks."build:contract"]
depends = ["env:check"]
run = "npm run build --workspace @call-calendar/contract"

[tasks."db:prepare"]
description = "Explicitly prepare an empty SQLite file at DATABASE_PATH"
depends = ["env:check"]
run = "node backend/src/prepare.ts"

[tasks.dev]
description = "Run both applications; stop both on failure or Ctrl+C"
depends = ["dev:frontend", "dev:backend"]

[tasks."dev:frontend"]
depends = ["build:contract"]
run = "npm run dev --workspace frontend --"

[tasks."dev:backend"]
depends = ["build:contract"]
run = "npm run dev --workspace backend"

[tasks.build]
depends = ["env:check"]
run = "npm run build"

[tasks.typecheck]
depends = ["env:check"]
run = "npm run typecheck"

[tasks.lint]
description = "Check JavaScript and TypeScript; reject warnings"
depends = ["env:check"]
run = "npm run lint"

[tasks."format:check"]
description = "Check formatting without changing files"
depends = ["env:check"]
run = "npm run format:check"

[tasks."release:check"]
description = "Validate release configuration with the pinned release-please schemas"
depends = ["env:check"]
run = "npm run release:check"

[tasks."release:dry-run"]
description = "Plan a release against controlled GitHub history without publication"
depends = ["release:check"]
run = "npm run release:dry-run"

[tasks.format]
description = "Format files except generated output, lockfiles and the Hexlet workflow"
depends = ["env:check"]
run = "npm run format"

[tasks.test]
description = "Build all workspaces and run HTTP, SQLite, process and release tests once"
depends = ["build"]
run = "npm test"

[tasks."browser:install"]
description = "Install the pinned Playwright Chromium; pass --with-deps on Linux"
depends = ["env:check"]
run = "npm run browser:install --"

[tasks."test:browser"]
description = "Build and check both roles in Chromium against frontend preview and isolated real backend"
depends = ["build"]
run = "npm run test:browser --"

[tasks.check]
description = "Check versions, lint, format, types, build, API generation, release, HTTP/process/browser and hk"
depends = ["env:check", "lint", "format:check", "typecheck", "test", "test:browser", "release:check", "api:check"]
run = "hk validate"

[tasks."start:backend"]
depends = ["env:check"]
run = "npm run start --workspace backend"

[tasks."preview:frontend"]
depends = ["env:check"]
run = "npm run preview --workspace frontend --"
