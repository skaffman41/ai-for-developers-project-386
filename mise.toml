min_version = "2026.11.3"

[tools]
node = "24.22.2"
hk = "2.11.1"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]

[tasks."env:check"]
description = "Check the exact mise, Node and npm versions"
run = "node scripts/check-env.mjs"

[tasks.setup]
description = "Check the environment and install locked npm dependencies"
depends = ["env:check"]
run = "npm ci"

[tasks.dev]
description = "Run both applications; stop both on failure or Ctrl+C"
depends = ["dev:frontend", "dev:backend"]

[tasks."dev:frontend"]
depends = ["env:check"]
run = "npm run dev --workspace frontend --"

[tasks."dev:backend"]
depends = ["env:check"]
run = "npm run dev --workspace backend"

[tasks.build]
depends = ["env:check"]
run = "npm run build"

[tasks.typecheck]
depends = ["env:check"]
run = "npm run typecheck"

[tasks.lint]
description = "Check JavaScript and TypeScript; reject warnings"
depends = ["env:check"]
run = "npm run lint"

[tasks."format:check"]
description = "Check formatting without changing files"
depends = ["env:check"]
run = "npm run format:check"

[tasks.format]
description = "Format files except generated output, lockfiles and the Hexlet workflow"
depends = ["env:check"]
run = "npm run format"

[tasks.test]
description = "Build both applications and run the HTTP smoke once"
depends = ["build"]
run = "npm test"

[tasks.check]
description = "Check versions, lint, formatting, types, build and HTTP smoke"
depends = ["env:check", "lint", "format:check", "typecheck", "test"]

[tasks."start:backend"]
depends = ["env:check"]
run = "npm run start --workspace backend"

[tasks."preview:frontend"]
depends = ["env:check"]
run = "npm run preview --workspace frontend --"
